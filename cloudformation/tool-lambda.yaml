AWSTemplateFormatVersion: '2010-09-09'
Description: 'MCP Tool Lambda for Serverless AI Agent System'

Parameters:
  VpcStackName:
    Type: String
    Description: 'Name of the VPC CloudFormation stack'
  
  LambdaCodeBucket:
    Type: String
    Description: 'S3 bucket containing Lambda deployment package'
  
  LambdaCodeKey:
    Type: String
    Default: 'tool-lambda.zip'
    Description: 'S3 key for Lambda deployment package'

Resources:
  # CloudWatch Log Group
  ToolLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-tool'
      RetentionInDays: 30

  # IAM Execution Role
  ToolExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      # RoleName removed to allow CloudFormation to generate unique name
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:ListAllMyBuckets'
                  - 's3:GetBucketLocation'
                  - 's3:ListBucket'
                Resource: '*'
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource:
                  - !GetAtt ToolLogGroup.Arn

  # Lambda Function
  ToolFunction:
    Type: AWS::Lambda::Function
    DependsOn: ToolLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-tool'
      Runtime: python3.12
      Handler: tools.lambda_handler.lambda_handler
      Role: !GetAtt ToolExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Timeout: 30
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub '${VpcStackName}-LambdaSecurityGroupId'
        SubnetIds:
          - Fn::ImportValue: !Sub '${VpcStackName}-PrivateSubnet1Id'
          - Fn::ImportValue: !Sub '${VpcStackName}-PrivateSubnet2Id'
      Environment:
        Variables:
          LOG_LEVEL: 'INFO'
      Tags:
        - Key: Application
          Value: 'serverless-ai-agent'
        - Key: Component
          Value: 'tool'

Outputs:
  StackName:
    Description: 'Tool Lambda Stack Name'
    Value: !Ref AWS::StackName
    Export:
      Name: !Sub '${AWS::StackName}-StackName'
  
  ToolFunctionArn:
    Description: 'Tool Lambda Function ARN'
    Value: !GetAtt ToolFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ToolFunctionArn'
  
  ToolFunctionName:
    Description: 'Tool Lambda Function Name'
    Value: !Ref ToolFunction
    Export:
      Name: !Sub '${AWS::StackName}-ToolFunctionName'
  
  ToolExecutionRoleArn:
    Description: 'Tool Lambda Execution Role ARN'
    Value: !GetAtt ToolExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ToolExecutionRoleArn'
  
  ToolLogGroupName:
    Description: 'Tool Lambda Log Group Name'
    Value: !Ref ToolLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-ToolLogGroupName'
